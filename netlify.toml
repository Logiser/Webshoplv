[build]
  command = "npm run build"
  publish = "build"
  environment = { CI = "false" }

# Depiend ár-szinkron: óránként (a PPC-feedek kérésenként a friss árat adják)
[functions."depiend-sync"]
  schedule = "0 * * * *"

# Kosárelhagyó emlékeztető: naponta délelőtt (8:30 UTC = 10:30 CEST)
[functions."cart-reminder"]
  schedule = "30 8 * * *"

# Depiend URL-lista CORS-szal (partner ár-szinkron segédfájl)
[[headers]]
  for = "/depiend-urls.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Google Shopping feed redirect
[[redirects]]
  from = "/google-shopping-feed.xml"
  to = "/.netlify/functions/google-shopping-feed"
  status = 200

# Árukereső feed redirect
[[redirects]]
  from = "/arukereso-feed.xml"
  to = "/.netlify/functions/arukereso-feed"
  status = 200

# ÁrGép feed redirect (platform-stratégiával szűrt terméklista)
[[redirects]]
  from = "/argep-feed.xml"
  to = "/.netlify/functions/argep-feed"
  status = 200

# SPA fallback - MINDIG az utolsó!
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
